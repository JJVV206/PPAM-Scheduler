services:
  postgres:
    image: postgres:16-alpine
    container_name: ppam-scheduler-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ppam_scheduler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ppam_scheduler_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ppam_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ppam_scheduler_postgres_data:
